# Veröffentlicht die App auf GitHub Pages, sobald etwas auf main landet:
# prüfen (Typen, Lint, Tests), bauen und dist/index.html als Startseite ausliefern.
# Einmalig nötig: im Repository unter Settings → Pages als Source „GitHub Actions“ wählen.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# immer nur eine Veröffentlichung zur Zeit; eine laufende wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typprüfung, Lint, Tests und Build in einem Rutsch
      - run: npm run verify
      # nur die Einzeldatei veröffentlichen, nicht die Artifact-Fassung
      - run: mkdir _site && cp dist/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
